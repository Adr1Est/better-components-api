services:

  db:
    image: postgres:18.1
    container_name: bettercomps_db
    restart: always
    volumes:
      - ./postgres:/var/lib/postgresql
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/18/docker